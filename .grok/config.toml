# Project-scoped MCP configuration for Grok
#
# This complements .mcp.json (used by Claude Code / Tidewave).
# Only the [mcp_servers] section is supported in project-level files.
#
# 4018 is the deployed node, reached through the operator's forward-only SSH
# tunnel (same port both sides). See ~/.claude/tidewave-ports.md.

[mcp_servers.tidewave]
# Tidewave project_eval escape hatch on the harness dashboard endpoint.
url = "http://localhost:4018/tidewave/mcp"
enabled = true
startup_timeout_sec = 15

[mcp_servers.harness]
# Native flat harness driver tools.
url = "http://localhost:4018/harness/mcp"
enabled = true
startup_timeout_sec = 15
