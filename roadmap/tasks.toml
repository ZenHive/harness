description = "Close the autonomous loop: a green run lands itself on the target branch with the human as pure witness. Acceptance-criteria visibility onto %Item{}, a cross-family adversarial semantic gate, a serialized merge-train (ff/rebase + integrated re-verify + rmap write-back), post-merge auto-repair and conflict re-dispatch with a blocked sink, a read-only witness notification channel, and a blocking dispatch__await MCP tool. Also carries per-run token capture (Task 20, milestone-unpinned) — a routing-efficiency signal that's topically adjacent but not a landing-loop gate."
order = 1
phase = 11

# ----------------------------------------------------------------------------
# Milestones
# ----------------------------------------------------------------------------

[milestones.v0_1]
name = "Core loop & contract proof"
description = "One rmap task driven end to end (Claude headless, isolated worktree, verified result), plus a second adapter (Codex) proving the AgentAdapter contract holds for two implementors"
order = 1
status = "done"
target_version = "0.1.0"

[milestones.v0_2]
name = "Batch & resilience"
description = "Proves an unattended multi-task dogfood batch survives partial failure without human babysitting — failure-classified retry filters transient from terminal, the repair loop turns at least some red verdicts green via session resume, and a single red run never craters the batch."
order = 2
status = "done"
target_version = "0.2.0"

[milestones.v0_3]
name = "Multi-agent & quota fail-over"
description = "Proves the AgentAdapter contract holds across N>2 implementors — adding Cursor, Grok, Antigravity, and Pi behind the same behaviour requires no Claude-/Codex-specific leak — and quota fail-over routes a batch around a capped subscription rather than failing it."
order = 3
status = "done"
target_version = "0.3.0"

[milestones.v0_4]
name = "Agent-facing surface"
description = "Proves harness is observable enough that a fresh session can pick up where the dispatching session left off — structured run records survive process exit, mix harness.status shows fleet state without raw JSON parsing, and Harness.AuditReview gives the audit-review skill an objective second-grader dispatch without routing through verification."
order = 4
status = "done"
target_version = "0.4.0"

[milestones.v0_5]
name = "Multi-Project & Dashboard"
description = "Proves harness scales beyond harness-on-harness — N registered projects (Elixir + Rust + ...) dispatched concurrently with restart-resilient Oban queues and a single LiveView dashboard is a workable shape, and the Postgres+Oban+Phoenix substrate doesn't crater the BEAM-native simplicity that made the single-project version work."
order = 5
status = "done"
target_version = "0.5.0"

[milestones.v0_6]
name = "Closeout & Release Readiness"
description = "Proves the built system is coherent for a fresh AI orchestrator: roadmap state reflects reality, README and harness-driver instructions match the live Tidewave/dashboard surface, deferred work stays out of the normal queue, and the release smoke path is verified end to end."
order = 6
status = "done"
target_version = "0.6.0"

[milestones.v0_7]
name = "Chat Orchestrator"
description = "Proves a tool-equipped LLM driven over a descripex-annotated harness surface can orchestrate dispatch end-to-end via natural language — replacing the two-eval mcp__harness__project_eval pattern as the default driver UX — and that the same annotated surface serves external MCP consumers (Sprite, Cursor BG, other Claude instances) without a separate Chat.Tools wrapper layer."
order = 7
status = "done"
target_version = "0.7.0"

[milestones.v0_8]
name = "Dashboard Operator UX"
description = "Proves a unified, designed dashboard chrome (persistent navbar + footer + shared component vocabulary) plus chat-style parsed transcripts on the run-detail page make harness consumable by a human operator — not just an AI driver — without requiring the operator to read raw stream-json or context-switch between visually fragmented per-page headers."
order = 8
status = "done"
target_version = "0.8.0"

[milestones.v0_9]
name = "Autonomous Landing"
description = "Proves harness can drive an rmap task from dispatch to a landed commit on the target branch with zero human gate — a cross-family adversarial grader approves the diff against its acceptance criteria, a serialized merge-train ff/rebase-merges and re-verifies the integrated state, post-merge reds and conflicts auto-repair via fresh re-dispatch, exhaustion routes to a blocked sink, and the human is a pure witness (notified, never asked). Tests the hypothesis that the autonomous loop's ceiling is set by acceptance-criteria visibility + grader adversariality, not by merge cleverness."
order = 9
status = "active"
target_version = "0.9.0"

[milestones.v0_10]
name = "Agent KPIs & Capability Routing"
description = "Proves evidence-based per-domain agent routing beats the orchestrator's default self-reliance: capability KPIs — gathered by dispatching a fixed benchmark corpus across every agent and graded by the verification stack, never self-report — change which agent gets dispatched and lower cost-to-green. Tests the hypothesis that the orchestrator falls back to the one familiar agent (or hand-builds) because it flies dark on the others' real capabilities, and that a per-(agent,domain) trust signal placed in the dispatch path corrects that."
order = 10
status = "pending"
target_version = "0.10.0"

