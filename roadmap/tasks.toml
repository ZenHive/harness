[[task]]
id = "23"
phase = 4
bundle = "multi-agent"
status = "done"
title = "Give Port-spawned agents an immediate-EOF stdin"
scores = { d = 3, b = 3, u = 3 }
markers = ["bug"]
depends_on = ["4"]
acceptance_criteria = ["A Port-spawned agent does not stall waiting on stdin", "The prompt and argv are passed without shell-quoting hazards", "The executable-not-found error path stays clear"]
body = """
Headless agent CLIs spawned over an OTP port inherit an open-but-empty stdin pipe. An agent that peeks stdin to support `cat file | agent -p` then stalls waiting for input that never comes: the Claude Code adapter's integration test shows `claude` printing `no stdin data received in 3s, proceeding without it` and eating a flat 3s per run. Other agents (Cursor, Codex, Grok) likely behave the same.

Give every Port-spawned agent process a stdin that is immediately at EOF, so it proceeds without the stall. The clean, shell-quoting-safe approach is the `sh -c '...' "$@"` argv trick — spawn `/bin/sh` with script `exec <agent> "$@" </dev/null` and pass the real agent argv as positional parameters, so no prompt escaping is needed. Decide whether this belongs in the generic `Harness.AgentAdapter.invoke/2` spawn or per-adapter `build_command/1`; if it moves into the generic spawn, preserve the clean `{:error, {:executable_not_found, _}}` signal that the current direct `System.find_executable/1` provides.
"""
implemented = "Spawn every agent through /bin/sh with an exec wrapper redirecting stdin from /dev/null, so a Port-spawned headless CLI gets an immediate EOF instead of stalling and exiting doing nothing. Fix lives in the generic AgentAdapter Port spawn (not per-adapter); exec keeps the port os_pid the agent itself so terminate/1 still reaches it; executable+argv ride as sh positional parameters so the prompt needs no shell quoting; System.find_executable/1 still gates the executable-not-found path. FakeAdapter gained stdin_eof and echo-text fixtures; new agent_adapter tests cover stdin-EOF and argv-verbatim. Surfaced by the first dogfood run, which exited :no_changes. Suite green (126 incl. integration); dialyzer/credo/doctor/sobelow clean."
