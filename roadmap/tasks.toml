Skim the source and docs of the candidate Elixir orchestration libraries — `opal`, `gen_agent` + `gen_agent_ensemble`, `altar_ai`, `ex_mcp`. The harness core is deliberately thin — a Port per run, a `gen_statem` per run, a `DynamicSupervisor` for batches, all stock OTP — and harness no longer needs a normalized event model, so the expected outcome is build-thin-core rather than adopt. Confirm that, and record any design ideas worth borrowing. Also settle the per-agent SDK question: determine whether `claude_code` and `codex_sdk` are CLI wrappers around the headless binary or native reimplementations. If they are wrappers, harness gains nothing from them — its raw-passthrough design discards an SDK's normalized event model, and OTP Ports already spawn the binary with better termination signals — so every adapter uses uniform Ports; only a native reimplementation that removes the external-binary dependency would justify the dep. Record both decisions in a concept doc.
