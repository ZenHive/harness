[[task]]
id = "59"
phase = 4
bundle = "multi-agent"
status = "done"
title = "Cross-agent grader as a repair-loop move (gated, asymmetric, budgeted)"
scores = { d = 5, b = 5, u = 4 }
depends_on = [11, 16]
acceptance_criteria = ["Triggered ONLY when a check fails twice with the same error signature within one run — never on perceived ambiguity, never on any red verdict", "Each consultation consumes one slot from :max_repair_attempts (same budget as same-agent repair; no separate budget)", "Asker emits a structured payload: proposed approach + cost-of-guessing-wrong sentence + the failing check evidence (mirrors the response-conventions.md `Derive Before You Ask` gate)", "Consultee is the opposite-agent grader via the same :claude ↔ :codex auto-pair as Harness.AuditReview — asymmetric grader, not dialogic", "Consultee returns approve/reject + one-line rationale on the proposed approach (verdict shape, not free-form back-and-forth) — parse via the existing <<<VERDICT:APPROVE|REJECT>>> sentinel", "No back-and-forth: one consultation = one grading round + one follow-up implementation pass by the asker; if that pass still goes red, the loop settles :failed", "Opt-in via config :harness, :cross_agent_repair, enabled: false by default", "Test: a run where the same check fails twice with the same signature dispatches the opposite-agent grader exactly once, charged against :max_repair_attempts", "Test: with cross_agent_repair disabled, the repair loop behaves identically to today (no consultation move)"]
out_of_scope = ["Multi-round dialogue between agents — one grading round only", "Asker-initiated consultations on perceived ambiguity — only same-error-twice trigger", "A separate cost budget — consultations charge against :max_repair_attempts", "Dynamic consultee selection — fixed :claude ↔ :codex pair like AuditReview", "Mid-run human consultation — agents only, no human-in-the-loop interjection"]
body = """
Extend Harness.Run's repair loop with one additional move: when a verification check fails twice in a row with the same error signature within a single run, dispatch the opposite-agent grader (the same :claude ↔ :codex pair Harness.AuditReview uses) for a one-shot grade of the asker's proposed approach before the asker's next attempt.

The motivating failure mode: the same-agent repair loop (Task 11) dead-ends when an agent's blind spot causes it to make the same wrong move twice. A bounded second-agent grader catches that class before the run settles :failed, without opening the floodgates to free-rider consultation.

Two design constraints make this safe — they are the whole point of the task:

1. **The trigger is evidence, not ambiguity.** Same-error-twice within one run, machine-detectable from the verification stack's per-check Result kind + error signature. No asker-initiated "I'm unsure, let me ask" path — that's exactly the failure mode response-conventions.md § "Derive Before You Ask" exists to prevent (questions become cheaper than reasoning). If the agent never sees the same error twice, no consultation happens.

2. **The shape is asymmetric grading, not dialogue.** Asker emits a structured payload — proposed approach, cost-of-guessing-wrong sentence, failing check evidence. Consultee returns approve/reject + one-line rationale via the existing <<<VERDICT:APPROVE|REJECT>>> sentinel (parse with Harness.AuditReview's existing extractor). One round. Asker then commits to their approach (approved) or pivots (rejected). No back-and-forth — that's the ping-pong failure mode.

Cost is borne by the same :max_repair_attempts budget. A consultation move counts as one repair attempt. This prevents the consultation surface from being a free interjection and keeps the run's wall-clock bounded.

Opt-in via config (`:cross_agent_repair, enabled: false` by default) so the baseline behavior of Task 11 is preserved and the new move only kicks in for users who explicitly opt into the autonomy lift.

The implementation reuses Harness.AuditReview.grade_fix/1 (Task 58) for dispatch and verdict parsing — that wrapper already handles the :claude ↔ :codex auto-pair, the Driver.run/3 dispatch path, and the sentinel extraction. The work is in Harness.Run: same-error-signature detection across attempts within a run, the structured-payload builder for the grader prompt, and the gen_statem state transition that consumes the verdict before the next implementation attempt.
"""
implemented = "Adds an opt-in cross-agent grader move to the repair loop. Gated by `config :harness, :cross_agent_repair, enabled: false`. New `:consulting` gen_statem state in Harness.Run; same-error-signature detection across repair attempts within one run; on the second observation of the same failure signature, harness spends one repair budget slot dispatching the opposite agent as a grader via Harness.AuditReview shape. Asymmetric (no dialogue) and budgeted (charges :max_repair_attempts). Test file: test/harness/run/cross_agent_repair_test.exs. 3-way merge against Task 60 resolved by relocating :pollution_allowlist doc into the moved :run config block."
delivered_by = "codex"
