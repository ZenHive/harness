The hard edges of autonomous landing, shaped by a two-peer LLM design consult. (1) Post-merge red: a branch green-in-isolation but red after integration is an INTEGRATION failure — the merge-train contract is 'target is always green after integration'. Handle it with a FRESH re-dispatch of the task against the integrated HEAD (NOT a session-resume with the stale diff — the in-run repair loop is the wrong tool here), re-verify, land if green. (2) True same-function conflict (rare; batch discipline mostly prevents it): re-dispatch the LOSER against the winner's HEAD (first-to-land = ground truth). A resolver agent that composes both diffs is explicitly NOT the default — both peers warned it produces plausible-but-wrong merges of two intents it can't reconcile. (3) Landing-attempt cap, distinct from the in-run repair cap: on exhaustion, flip the rmap task to blocked with a structured blocked_reason — the terminal sink ('without a sink you are lying about autonomy'). Reuse rmap's existing blocked + blocked_reason; no schema change. No path may loop unbounded.
"""
