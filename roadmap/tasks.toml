status = "done"
title = "Skip pollution detection for adapters declaring worktree_isolation: true"
scores = { d = 3, b = 5, u = 7 }
markers = ["bug"]
depends_on = [32, 41, 60]
acceptance_criteria = ["A run dispatched on an adapter with `worktree_isolation: true` does not invoke the snapshot/diff check and cannot settle `:checkout_polluted` from operator activity in the main checkout", "A run dispatched on an adapter with `worktree_isolation: false` is still blocked at dispatch by the existing `check_dispatch/1` gate (Antigravity case)", "Test: a run on a verified-isolation adapter where the main checkout is mutated mid-run (simulated parallel `rmap`/`git commit` activity) settles by the normal verification verdict, never `:checkout_polluted`", "Documentation in `lib/harness/worktree/isolation.ex` `@moduledoc` updated to explain the skip and the policy"]
out_of_scope = ["Correlation-based detector (compare agent diff vs main porcelain) — separately worthwhile if an unverified-isolation adapter ever ships", "Removing `Harness.Worktree.Isolation` outright — the dispatch-time `check_dispatch/1` gate stays for the Antigravity case", "Changes to the pollution_allowlist mechanism from Task 60 — orthogonal; this skips the check entirely for trusted adapters, allowlist is for the residual case"]
body = """
`Harness.Worktree.Isolation` runs its snapshot/diff check on every dispatched run, including for adapters that declare `worktree_isolation: true` in their `capabilities/0`. The check exists to catch agents that ignore their port `cwd` and write into the main checkout (the original Antigravity / Codex-pre-Task-41 case). For an adapter whose isolation is *verified* — Claude, Codex (post-Task-41), Cursor, Grok, Pi — the check produces only false positives: it cannot distinguish "agent wrote outside its worktree" from "operator (or a parallel session) ran `rmap status` / `audit-review` / any other commit-producing tool in the main checkout while the run was in flight."

Repeatedly biting now (2026-05-27): a Task 54 Claude smoke-test settled `:checkout_polluted` while the dispatching session was running audit-review in parallel — the agent's 119-LOC diff in its own worktree was correct and ungraded, the run wasted.

Fix: when the selected adapter declares `worktree_isolation: true`, skip the snapshot/diff check entirely. The capability is the trust contract — if we trusted it enough to dispatch the run, we trust it enough to not paranoia-check the result. Adapters declaring `worktree_isolation: false` (Antigravity today) stay blocked at dispatch via `Harness.Worktree.Isolation.check_dispatch/1`; that gate is unchanged.

Out of scope: the more ambitious correlation-based detector (compare agent's worktree diff against main-checkout porcelain to distinguish operator churn from agent escape). That's a fallback option if a future unverified-isolation adapter needs the runtime check. For now, every adapter we ship is verified, so the simpler "trust the capability" path is right.
"""
created_at = "2026-05-27"
scored_at = "2026-05-27"
implemented = "Updated `Harness.Run` so adapters declaring `worktree_isolation: true` skip the main-checkout snapshot/diff path entirely; `nil` snapshots already make `Isolation.check_pollution/3` a no-op. Antigravity and other `worktree_isolation: false` adapters remain blocked by `Harness.Worktree.Isolation.validate/1` before spawn. Added a Task 66 regression test that writes a normal worktree diff while mutating the source checkout and verifies the run settles by the normal verification verdict, plus updated the isolation module docs."
done_at = "2026-05-27"

