schema_version = 2
project = "harness"
default_branch = "development"
vision = "An OTP-native task-execution engine an AI orchestrator drives end to end: it pulls tasks from the rmap roadmap, dispatches each to a headless coding agent running in an isolated worktree, runs the target project's own check stack against the result, and reports verified outcomes back over an agent-shaped surface (MCP tools / JSON CLI)."

[focus]
phase = 1

# ----------------------------------------------------------------------------
# Phases
# ----------------------------------------------------------------------------

[phases.1]
name = "Foundation"
order = 1
status = "pending"

[phases.2]
name = "Single-Agent Core Loop"
order = 2
status = "pending"

[phases.3]
name = "Batch & Resilience"
order = 3
status = "pending"

[phases.4]
name = "Multi-Agent & Quota Fail-over"
order = 4
status = "pending"

[phases.5]
name = "Surface & Observability"
order = 5
status = "pending"

[phases.6]
name = "Deferred"
order = 6
status = "pending"

# ----------------------------------------------------------------------------
# Bundles
# ----------------------------------------------------------------------------

[bundles.scaffold]
description = "mix project scaffold + standard dep stack"
order = 1
phase = 1

[bundles.contract]
description = "Orchestration-library evaluation; the AgentAdapter behaviour"
order = 2
phase = 1

[bundles.claude-adapter]
description = "Claude Code headless adapter"
order = 1
phase = 2

[bundles.core-loop]
description = "Worktree lifecycle, rmap ingestion, verification runner, supervised run lifecycle"
order = 2
phase = 2

[bundles.resilience]
description = "Batch fan-out, failure-classified retry, autonomous repair loop"
order = 1
phase = 3

[bundles.multi-agent]
description = "Conformance suite, Cursor/Codex/Grok adapters, capability + availability registry"
order = 1
phase = 4

[bundles.surface]
description = "Agent-shaped MCP/CLI surface, human status view, run logging"
order = 1
phase = 5

[bundles.deferred]
description = "Parked work — revisit after the core milestones ship"
order = 1
phase = 6

# ----------------------------------------------------------------------------
# Milestones
# ----------------------------------------------------------------------------

[milestones.v0_1]
name = "Single-agent core loop"
description = "One rmap task driven end to end — Claude headless, isolated worktree, verified result"
order = 1
status = "active"
target_version = "0.1.0"

[milestones.v0_2]
name = "Batch & resilience"
description = "Concurrent batch fan-out, failure-classified retry, autonomous repair"
order = 2
status = "pending"
target_version = "0.2.0"

[milestones.v0_3]
name = "Multi-agent & quota fail-over"
description = "Cursor, Codex, Grok adapters behind one contract; quota-aware routing"
order = 3
status = "pending"
target_version = "0.3.0"

[milestones.v0_4]
name = "Agent-facing surface"
description = "MCP tools + JSON CLI, status view, run logging"
order = 4
status = "pending"
target_version = "0.4.0"

# ----------------------------------------------------------------------------
# Tasks
# ----------------------------------------------------------------------------

[[task]]
id = "1"
phase = 1
bundle = "scaffold"
milestone = "v0_1"
status = "pending"
title = "Scaffold the OTP application + standard dep stack"
scores = { d = 2, b = 5, u = 7 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Scaffold `harness` as an Elixir OTP application with a supervision tree — it orchestrates long-lived agent runs, so it needs one. Add the standard project dep stack and tooling per the global Elixir setup conventions (Styler, Credo, Dialyxir, Doctor, ex_unit_json, dialyzer_json, descripex, Sobelow, and Reach as a dev/test analysis dep), wired into `mix.exs`, `.formatter.exs`, and `cli/0` preferred_envs. Generate the baseline `.gitignore`, `README.md`, and `CHANGELOG.md`.
"""
acceptance_criteria = [
  "`mix compile` is clean",
  "`mix test` runs the default suite green",
  "Styler is first in the `.formatter.exs` plugins list",
  "The supervision tree starts under `Application`",
]

[[task]]
id = "2"
phase = 1
bundle = "contract"
milestone = "v0_1"
status = "pending"
title = "Evaluate orchestration libraries — confirm thin-core"
scores = { d = 3, b = 5, u = 5 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Skim the source and docs of the candidate Elixir orchestration libraries — `opal`, `gen_agent` + `gen_agent_ensemble`, `altar_ai`, `ex_mcp`. The harness core is deliberately thin — a Port per run, a `gen_statem` per run, a `DynamicSupervisor` for batches, all stock OTP — and harness no longer needs a normalized event model, so the expected outcome is build-thin-core rather than adopt. Confirm that, and record any design ideas worth borrowing. Record the decision in a concept doc.
"""
acceptance_criteria = [
  "Each candidate skimmed for whether it offers anything the thin OTP core doesn't",
  "A written build-vs-adopt decision with rationale",
  "Any borrowed design ideas are recorded with their source",
]
out_of_scope = [
  "Writing any adapter or orchestration code — this task is evaluation only",
  "Adding any candidate library as a dependency",
]

[[task]]
id = "3"
phase = 1
bundle = "contract"
milestone = "v0_1"
status = "pending"
depends_on = ["2"]
title = "Define the AgentAdapter behaviour — invocation + capture"
scores = { d = 3, b = 9, u = 9 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Define the core contract every agent adapter implements — a `behaviour` that, given a task spec plus run options, builds the agent's headless command line, spawns it, detects termination, and hands back the raw captured output plus wall-clock duration. Deliberately no normalized event model: harness does not parse or remap each agent's JSON — the consumer is an AI that reads raw transcripts natively, and harness derives run success from its own verification stack, not the agent's self-reported result. The behaviour also declares per-adapter capabilities (session resume, permission modes, and so on). Contract only — no concrete adapter.
"""
acceptance_criteria = [
  "An `AgentAdapter` behaviour with documented callbacks for invoke / capture / terminate",
  "Raw agent output is passed through untouched — no per-agent event normalization",
  "A capability declaration each adapter fills in",
  "Nothing Claude-specific leaks into the contract",
]
out_of_scope = [
  "Building any concrete adapter",
  "Any normalized or typed event model — explicitly cut",
]

[[task]]
id = "4"
phase = 2
bundle = "claude-adapter"
milestone = "v0_1"
status = "pending"
depends_on = ["3"]
title = "Build the Claude Code headless adapter"
scores = { d = 6, b = 9, u = 9 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Implement the first concrete adapter — driving Claude Code headlessly via `claude -p` over Ports (or the `claude_code` hex SDK if the Phase-1 evaluation favors it). Capture the raw output stream and hand it back unparsed. Wire working directory, permission mode, and session resume/continue. Detect termination from the process/Port closing plus a timeout guard — never from the exit code, which is known to be unreliable.
"""
acceptance_criteria = [
  "A headless prompt run captures raw output and reports termination",
  "Working directory and permission mode are wired",
  "Session resume works across two runs",
  "Termination is derived from process exit + timeout, not `$?`",
]

[[task]]
id = "5"
phase = 2
bundle = "core-loop"
milestone = "v0_1"
status = "pending"
markers = ["parallel"]
title = "Worktree-per-job lifecycle"
scores = { d = 4, b = 7, u = 8 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
harness runs every job in an isolated git worktree so concurrent agent runs never collide and the verification stack has a clean checkout to grade. Implement worktree creation per run, dispatch of the agent into it, and a keep-or-tear-down decision on completion (retain on failure for inspection; configurable). This is the automation of the repo's existing worktree-per-branch convention.
"""
acceptance_criteria = [
  "Each run gets its own isolated git worktree",
  "Concurrent runs do not collide on the working tree",
  "Worktrees are cleaned up on success and retained on failure (configurable)",
  "A crashed run does not leak an orphan worktree",
]

[[task]]
id = "6"
phase = 2
bundle = "core-loop"
milestone = "v0_1"
status = "pending"
markers = ["parallel"]
title = "rmap task ingestion"
scores = { d = 3, b = 7, u = 7 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Let harness pull a task straight from the rmap roadmap — read `roadmap/tasks.toml` / `roadmap/data.json` (or shell out to `rmap`) and render the task as a ready-to-run agent prompt. `rmap delegate <id> --to <agent>` already emits a paste-ready prompt; harness consumes that instead of a human copy-pasting it. This is the input half of the loop — the roadmap becomes the job queue.
"""
acceptance_criteria = [
  "harness fetches a task — by id, or the next pending one — from the rmap roadmap",
  "The task renders to an agent-ready prompt suitable for the adapter",
  "Ingestion reads the rmap source — it does not duplicate the roadmap",
]

[[task]]
id = "7"
phase = 2
bundle = "core-loop"
milestone = "v0_1"
status = "pending"
markers = ["parallel"]
title = "Verification runner — run the target project's check stack"
scores = { d = 5, b = 9, u = 8 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
After an agent finishes, harness runs the target project's own check stack against its worktree and produces a structured pass/fail — this is what makes "did the job succeed?" objective and agent-agnostic, instead of trusting the agent's self-report. The check set is a configurable list of commands; ship an Elixir preset (`mix test.json`, `mix dialyzer.json`, doctor, sobelow, credo). Aggregate each check's result into one verdict the run lifecycle can gate on.
"""
acceptance_criteria = [
  "A configurable list of check commands runs against a given worktree",
  "An Elixir preset is provided as the default check set",
  "Each check's pass/fail and output are captured into a structured verdict",
  "Any red check makes the overall verdict red",
]
out_of_scope = [
  "Feeding failures back to the agent — that is the autonomous repair loop task",
]

[[task]]
id = "8"
phase = 2
bundle = "core-loop"
milestone = "v0_1"
status = "pending"
depends_on = ["4", "5", "7"]
title = "Supervised run lifecycle process"
scores = { d = 5, b = 9, u = 9 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Implement the supervised process that owns one job end to end — model it as a `gen_statem` moving through `dispatched → running → verifying → {done | failed}`. It creates the worktree, spawns the adapter, waits for termination, runs the verification stack, and settles on a verdict. Crash isolation (a failed run never touches siblings), a per-run timeout, and external cancellation. The run state must be observable. Completing this task is the v0.1 core loop working end to end for a single task.
"""
acceptance_criteria = [
  "One job = one supervised `gen_statem` with observable state",
  "It drives worktree → adapter → verification and settles on a verdict",
  "A crashing run is isolated from siblings",
  "Per-run timeout and external cancellation both work",
]

[[task]]
id = "9"
phase = 3
bundle = "resilience"
milestone = "v0_2"
status = "pending"
depends_on = ["8"]
title = "Batch orchestrator with concurrency cap"
scores = { d = 5, b = 9, u = 8 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Implement the batch layer — fan a set of tasks out across run-lifecycle processes under a `DynamicSupervisor`, with a configurable concurrency cap, and collect the per-task verdicts. Tolerate partial failure: one failed or red run must not abort the batch; the batch result reports every task's outcome. A batch is typically an rmap bundle or an `rmap next-bundle` result.
"""
acceptance_criteria = [
  "A batch of N tasks runs under a concurrency cap of M",
  "Partial failure is tolerated — the batch completes and reports per-task status",
  "Per-task verdicts are collected into one batch result",
]

[[task]]
id = "10"
phase = 3
bundle = "resilience"
milestone = "v0_2"
status = "pending"
depends_on = ["8"]
markers = ["parallel"]
title = "Retry policy with failure classification"
scores = { d = 4, b = 7, u = 6 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Add a per-run retry policy that first classifies the failure. Transient failures (a process crash, a flaky check) retry with capped exponential backoff. Quota exhaustion — a subscription agent hitting its cap — is NOT retryable on a useful timescale (the reset window is hours); it must stop retrying that agent immediately, marked for fail-over rather than backoff. Genuine terminal task failures are never retried. Make the policy injectable per batch or per run.
"""
acceptance_criteria = [
  "Failures are classified as transient, quota-exhausted, or terminal",
  "Transient failures retry with capped exponential backoff",
  "Quota exhaustion stops retrying that agent at once — no backoff loop against a multi-hour wall",
  "Terminal failures are not retried",
  "The policy is configurable per batch or per run",
]

[[task]]
id = "11"
phase = 3
bundle = "resilience"
milestone = "v0_2"
status = "pending"
depends_on = ["7", "8"]
markers = ["parallel"]
title = "Autonomous repair loop"
scores = { d = 5, b = 8, u = 7 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Close the verify loop. When verification comes back red, feed the failing checks' output back to the same agent via session resume and re-run, up to a configurable attempt cap. The objective check stack is the grader, so an agent iterating against it is not self-grading. Stop on green, on the attempt cap, or on a non-repairable failure class (e.g. quota exhaustion — hand to fail-over instead).
"""
acceptance_criteria = [
  "A red verdict triggers a repair attempt — failures fed back via session resume",
  "The loop stops on green or at the attempt cap",
  "A quota or terminal failure ends the loop instead of burning attempts",
  "The number of repair attempts is configurable",
]

