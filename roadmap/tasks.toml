[[task]]
id = "16"
phase = 4
bundle = "multi-agent"
milestone = "v0_3"
status = "pending"
depends_on = ["13", "14", "15"]
title = "Capability + availability registry with quota fail-over"
scores = { d = 5, b = 7, u = 6 }
scored_at = "2026-05-20"
created_at = "2026-05-20"
body = """
Add a registry the orchestrator queries before dispatch. Each adapter declares its capabilities (session resume, permission granularity, MCP/tool config, and so on) so a run requesting an unsupported capability is rejected up front with a clear error. The registry also tracks availability — when an agent hits its subscription quota, the orchestrator routes the job to another agent with headroom instead of failing it. This is the concrete payoff of running multiple adapters.
"""
acceptance_criteria = [
  "Each adapter declares its capabilities",
  "A run requesting an unsupported capability is rejected up front, not mid-run",
  "A quota-exhausted agent is marked unavailable and the job fails over to a capable agent with headroom",
  "Fail-over routing is observable",
]

