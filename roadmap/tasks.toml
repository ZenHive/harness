[[task]]
id = "73"
phase = 8
bundle = "closeout"
milestone = "v0_6"
status = "done"
title = "ResultStore.File.list_run_records skips undecodable term files instead of halting"
scores = { d = 2, b = 5, u = 7 }
acceptance_criteria = ["Harness.ResultStore.File.list_run_records/2 returns {:ok, [LogRecord.t()]} containing every healthy record, even when one or more sibling files fail safe-decode", "Undecodable / atom-stale files are logged via Logger.warning with the path and the reason, then skipped (matching the existing {:ok, _other} skip clause's spirit)", "An ExUnit test in test/harness/result_store/file_test.exs reproduces the scenario: a directory containing one valid LogRecord term + one file with arbitrary bytes; list_run_records returns the valid record and logs a warning for the corrupt one", "The two-eval Tidewave smoke from SKILL.md returns a list of records (possibly empty after filtering) instead of {:error, {:invalid_term_file, _}}"]
out_of_scope = ["Rewriting the on-disk format or migrating to an Ecto-backed store", "GC / TTL of old term files — that is a separate operational concern", "Changing the public Harness.ResultStore behaviour or LogRecord shape"]
body = """
Smoke-discovered runtime bug from Task 71. `Harness.ResultStore.list_run_records/1` halts on the first file under `~/.harness/results/runs/` that fails `:erlang.binary_to_term/2` with the `:safe` flag — `read_term/1` (`lib/harness/result_store/file.ex:106-113`) returns `{:error, {:invalid_term_file, path}}`, and `collect_records/2` (lines 63-85) treats any `{:error, _}` as a halt. A single corrupt or atom-stale term file therefore prevents ANY records from being returned, including all the healthy ones.

Reproduced live on 2026-05-27 against the running dev BEAM: 32 healthy `.term` files in `~/.harness/results/runs/`, one earlier file that fails `:safe` decode (almost certainly atom-stale from a pre-restart LogRecord shape or removed atom). Every `Harness.ResultStore.list_run_records([])` call returns `{:error, {:invalid_term_file, ...}}` — the documented Tidewave dispatch-and-observe pattern in `skills/harness-driver/SKILL.md` and `docs/dogfooding-workflow.md` is consequently broken end-to-end.

The fix mirrors the already-present `{:ok, _other}` skip clause in `collect_records/2`: a `{:error, {:invalid_term_file, _}}` (and arguably any `{:error, _}` from per-file read) should be logged as a warning and skipped, not halt the entire query. The `{:ok, _other}` clause's reasoning ("stale or cross-typed entries shouldn't crash list_run_records") applies equally to atom-stale safe-decode failures.

Out of scope for the fix: rewriting the on-disk format, GC of old term files, or migrating to an Ecto-backed store.
"""
implemented = "Harness.ResultStore.File.collect_records/2 now reduces with Enum.reduce/3 instead of reduce_while/3 — atom-stale or undecodable .term files are logged via Logger.warning and skipped, returning {:ok, [healthy_records]} instead of halting on the first {:error, _}. Spec narrowed to {:ok, [LogRecord.t()]} (no longer error-returning at the collection step). test/harness/result_store/file_test.exs covers (a) one corrupt sibling + one healthy record → healthy record returned, warning logged; (b) only-corrupt directory → {:ok, []}."
delivered_by = "claude-code"
verified = true
created_at = "2026-05-27"
scored_at = "2026-05-27"
done_at = "2026-05-28"

