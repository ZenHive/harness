body = """
Build the LiveView UI for the chat orchestrator. Page at /harness/chat (and /harness/chat/:session_id for reload-safe links) mounted on the existing Harness.Dashboard.Router. UI: message list scrolling to bottom, streaming render of agent tokens as they arrive, collapsible JSON view for tool calls/results, send-message input form.

Subscribe to Phoenix.PubSub topic harness:chat:<session>:stream (broadcast by Harness.Chat.Session from Task 76) and update the message list via `stream_insert(socket, :messages, ..., at: -1)` so the active message is replaced in place on each chunk (DOM id stable across updates). Do NOT accumulate the message list in `socket.assigns` — that's the pre-streams pattern and breaks on long sessions. For very high token rates, a client-side `phx-hook` that buffers chunks into the DOM without a server roundtrip is the alternative; pick one explicitly and document which.

Session id lives in the URL path so reload preserves the live session — when the LiveView mounts with a session_id, it reconnects to the existing GenServer; without one, it creates a fresh session.

Use the existing per-run drill-down LiveView (Harness.Dashboard.Live for runs) as a structural template ONLY for the router-mount + PubSub-subscription + transcript-buffer-bounding patterns. Do NOT copy its collection assigns pattern (`assign(:projects, ...)`, `assign(:adapters, ...)`) — those predate the streams refactor and are not the model to follow for the new message list / tool-call list.

Browser smoke: a user types 'list pending tasks in harness project', the agent calls list_projects, then list_pending(project: "harness"), then summarizes. The UI shows the streaming tokens, the two tool calls as collapsible JSON, and the final summary — all rendered in real time without page reload.

## Visual design

This is the first new LiveView since the dashboard's utilitarian bootstrap and sets the visual vocabulary for the v0_7+ LiveViews (78, 80, 81). Commit to a clear, intentional aesthetic and execute precisely. Context: operator long-session use, dense information, low decoration tolerance — refined minimalism with deliberate typographic and motion choices, not maximalist chaos.

Constraints (non-negotiable):
- Typography: distinctive display + refined mono. Pair a characterful display face for headings/role labels with a monospace for run-IDs / JSON / tool arguments. Forbidden: Inter, Roboto, Arial, system-ui defaults, Space Grotesk. Pick something specific (e.g. Newsreader + JetBrains Mono, IBM Plex Sans/Mono, Fraunces + Berkeley Mono — your call, but commit and document the choice in the layout module's moduledoc).
- Color: dark-mode-first (long-session operator). Dominant neutral plane + one sharp signal accent reserved exclusively for terminal-state cues (verdict pass/fail, error, stream-finished). No purple-on-white gradients. No bucket-pill rainbow. The accent earns visibility by being rare.
- Motion: CSS-only; respect `prefers-reduced-motion`. Orchestrate the high-impact moments — streaming-token cursor pulse, tool-call expand/collapse, message-arrival reveal — instead of scattering micro-interactions everywhere.
- Layout: differentiate the three message roles (user / agent / tool-call) with more than color — typographic weight, marginal alignment, decorative rule, role-specific column treatment. The tool-call collapsible is the most-rendered element in this UI and cannot read as "code block on grey panel."
- Backgrounds/texture: avoid flat panels. Thin grain, subtle gradient mesh, or carefully-placed dividing rules contribute atmosphere without competing with content.

Design-token deliverable: define font imports, CSS custom-properties (color, type scale, spacing scale, motion timing), and any shared shell elements in a single place exposed by `Harness.Dashboard.Layouts` (or a new `Harness.Dashboard.Tokens` module). Tasks 80 and 81 inherit this vocabulary — they must not invent a second one.

The existing `lib/harness/dashboard/layouts/root.html.heex` is utilitarian bootstrap (system-ui + inline `<style>`) and should be upgraded as part of this work; refactor cost is part of this task, not a follow-up.

Principle: intentional aesthetic point-of-view; avoid generic AI-generated patterns (cookie-cutter component grids, evenly-distributed timid palettes); match implementation complexity to the aesthetic — refined minimalism here needs *more* attention to spacing, typography, and motion timing, not less.

## LiveView 1.x / Phoenix 1.8 idioms (non-negotiable)

These constraints apply to all three v0_7+ LiveViews (78, 80, 81) and to any refactor of the existing operator views the design pass touches.

- **Collections use `stream/3`, not assigns lists.** The messages list, the tool-call list, the ranked-task list (Task 80), the per-adapter transcripts (Task 81) — all are streams. Mount them with `stream(socket, :messages, [], dom_id: &"msg-#{&1.id}")` (or similar), render with `<div id="messages" phx-update="stream"><div :for={{dom_id, msg} <- @streams.messages} id={dom_id}>...</div></div>`. Token chunks arrive via PubSub → `stream_insert(socket, :messages, %{id: msg_id, content: accumulated}, at: -1)` which replaces in place by DOM id. Never `Map.update(assigns, :messages, &(&1 ++ [msg]))`.
- **Templates use HEEx `:if` / `:for` special attrs**, not `<%= if/for %>` wrappers around tags. The 1.7+ idiom; 1.8 is unchanged.
- **Reusable UI is function components.** The collapsible tool-call block, the message-role row, the adapter picker (Task 80), the verdict cell (Task 81) — each is a `Phoenix.Component` with `attr/3` declarations (typed, required where applicable, with defaults). No render-helpers-with-positional-args, no string-interpolation HTML.
- **Layout tuple shape:** `use Phoenix.LiveView, layout: {Harness.Dashboard.Layouts, :app}` — already the pattern in `dashboard/live.ex`, keep it.
- **`prefers-reduced-motion` is a media query at the CSS layer**, not a server-side branch. Motion is gated in the tokens module's stylesheet, not in HEEx.
- **No `Phoenix.HTML.raw/1` on user-or-LLM-supplied content.** Tool-call JSON is rendered via a function component that walks the parsed map, not by pretty-printing to a string and dumping into `<pre>` raw.
- **Bounded buffers for streaming text** — the existing `Harness.Dashboard.Live` already enforces a 200 KiB transcript cap; the chat session message buffer must do the same (bound per-message and per-session), and the bound is enforced server-side, never just CSS `max-height: ...; overflow: auto`.

These are idiom-floor requirements, independent of the visual design vocabulary. Both must hold.
"""
