  "New module lib/harness/dashboard/transcript/parser.ex exposes `init_state/1 :: parser_state`, `append/3 :: (agent_kind, chunk, parser_state) -> {events, new_parser_state}`, and `finalize/2 :: (agent_kind, parser_state) -> {events, new_parser_state}` — pure module, no GenServer, no side effects",
