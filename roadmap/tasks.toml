acceptance_criteria = ["New module `lib/harness/chat/claude.ex` implements `Harness.Chat.Backend`", "Default in `Harness.Chat.Session.init/1` changed from `Harness.Chat.Anthropic` to `Harness.Chat.Claude`", "`Harness.Chat.Claude` does NOT read `ANTHROPIC_API_KEY` anywhere; explicitly scrubbed on Port env", "Driver-double-backed tests cover: happy path (text-only response), tool_use parsing, error mapping, session continuity across two turns", "Existing `Harness.Chat.Anthropic` tests still pass (Anthropic stays opt-in)", "Browser smoke (manual, post-merge): dashboard chat session via `Harness.Chat.Claude` invokes one harness MCP tool and returns a coherent response"]
out_of_scope = ["Removing or renaming `Harness.Chat.Anthropic` — stays as opt-in metered fallback", "Changing the `Harness.Chat.Backend` behaviour shape", "Adding a backend selector to `ChatLive` UI (sibling task if desired)", "Persistence of chat session ids across `iex -S mix` restarts"]
body = """
Add a `Harness.Chat.Backend` implementation that drives headless `claude -p` via
`Harness.AgentAdapter.Driver` (Port spawn), replacing `Harness.Chat.Anthropic`
as the *default* backend. Anthropic stays in the tree as opt-in metered fallback.

**Why this exists.** Task 77 shipped `Harness.Chat.Anthropic` — a direct Req
client against `https://api.anthropic.com/v1/messages` with `x-api-key`. That
violates the standing policy "Claude subscription, not API" (memory:
feedback_claude_subscription_not_api). Chat sessions should route through the
host's Claude subscription OAuth, not the metered API.

**Implementation shape:**

- New `lib/harness/chat/claude.ex` implementing `Harness.Chat.Backend`.
- Per-turn: spawn `claude -p <latest-user-message> --output-format stream-json --session-id <chat-session-id>` (or `--continue`, depending on resume-flag verification — see Sharp Edges) via `Harness.AgentAdapter.Driver.run/3` or equivalent Port spawn.
- Configure `.mcp.json` in the spawn cwd pointing at Task 79's headless MCP endpoint (`http://localhost:4018/harness/mcp/...`) so harness manifest tools are surfaced to claude. Exact `.mcp.json` shape + cwd-relative loading semantics confirmed via Claude Code docs as a pre-implementation step.
- Parse stream-json events into Backend callbacks: `text_delta` → `:text_delta`; `tool_use` blocks → `:tool_use`.
- Return assembled assistant response matching `Backend.response()`.
- Flip default in `Harness.Chat.Session.init/1` (line 74) from `Harness.Chat.Anthropic` to `Harness.Chat.Claude`. Anthropic remains opt-in (`backend: Harness.Chat.Anthropic`).

**Sharp edges:**

- `claude -p` manages its own conversation state via session id, not a caller-supplied message list. `Backend.stream/3` receives a full `messages` list; this backend extracts only the latest user message and relies on claude's session continuity for history. Document in the moduledoc.
- `ANTHROPIC_API_KEY` must NOT be read by this backend at any layer; explicitly scrub it from the Port env to prevent shadowing of the host OAuth.
- `claude -p` session-resume flag and `.mcp.json` cwd-relative loading both require verification against current Claude Code docs (Jan 2026 cutoff is past the relevant releases).
"""
created_at = "2026-05-28"
scored_at = "2026-05-28"

[[task]]
id = "83"
phase = 9
bundle = "chat-orchestrator"
status = "done"
title = "Fix anubis StreamableHTTP transport — initialize crashes with :badarg, blocks all MCP tool exposure to claude -p"
scores = { d = 4, b = 8, u = 8 }
markers = ["bug"]
depends_on = [79]
acceptance_criteria = ["MCP initialize from claude-code 2.1.153 (protocol 2025-11-25) completes without :badarg", "GET-equivalent tools/list over the streamable_http transport returns the harness toolset (descripex-sourced) as a valid MCP response", "A tool-using prompt in /harness/chat actually invokes a harness tool (visible in the dashboard tool_call render with the harness-tool name, not Claude's built-in Bash/TaskList)", "End-to-end smoke documented in CLAUDE.md updates: 'live LLM-driven smoke gated on Task 82' bullet flips to 'verified end-to-end via /harness/chat exercising N harness tools'", "Phoenix logs during a tool-using chat turn contain zero :badarg or 500 responses from /harness/mcp"]
out_of_scope = ["Auth / multi-tenant / rate limiting on the MCP endpoint (out-of-scope per Task 79)", "Supporting MCP clients other than claude -p (other consumers can be added later if/when they appear)", "Replacing anubis_mcp with a different MCP library — first try to make anubis work correctly"]
body = """
Every MCP initialize call from `claude -p` (claude-code 2.1.153, protocol "2025-11-25") crashes inside Anubis.Server.Transport.StreamableHTTP.Plug with `:badarg`, returning HTTP 500. Reproduced ~20+ times in a single chat-orchestrator browser smoke run on 2026-05-28 against the Task 82 backend.

Symptom: claude -p never receives the harness tool list, so it falls back to its own built-ins (Bash, TaskList, ToolSearch) and hallucinates that the harness toolset is empty / no tasks exist. The v0_7 LLM-driven smoke (the entire reason Task 82 + Task 79 exist) is therefore not actually exercising the harness tools — it only looks like it is because the chat UI renders Claude's built-in tool calls correctly.

Repro: open /harness/chat in a browser with claude-code installed, send any tool-needing prompt, watch the Phoenix logs — every request shows `Anubis.Server.Transport.StreamableHTTP.Plug` followed immediately by `Converted error :badarg to 500 response`.

The request shape coming in is a clean JSON-RPC 2.0 initialize with the standard MCP 2025-11-25 envelope; the failure is downstream inside anubis. Suspect: protocol-version handling, an unsupported capability key (`elicitation`, `roots`), or a missing route on the supervised Anubis.Server pipeline.

Investigate by (a) catching the badarg in the Plug to get a real stack trace (the cascading ErrorHTML crash is hiding it — see sibling task), (b) reading anubis_mcp source for what `:badarg` paths exist on `tools/list` and `initialize` handlers, and (c) checking whether `Harness.Dashboard.MCPServer` needs to declare additional capabilities beyond `[:tools]` for the streamable_http transport to complete the handshake.
"""
implemented = "Anubis StreamableHTTP transport started cleanly. Root cause: anubis's should_start?({:streamable_http, opts}) for the transport falls through to Application.get_env(:phoenix, :serve_endpoints) when the :start opt is absent. That flag is false under iex -S mix because harness is not a phx.server app (the dashboard is one opt-in surface among many — see CLAUDE.md mountable-consumer story). Result: Anubis.Server.Supervisor.init/1 returned :ignore, the :persistent_term {Anubis.Server.Supervisor, MCPServer, :session_config} was never stored, and every MCP request crashed inside Anubis.Server.Transport.StreamableHTTP.Plug.resolve_runtime_config/1 on persistent_term.get/1 with ArgumentError (logged as :badarg + converted to 500). The first explorer's negotiate/2-returns-:error diagnosis was contradicted by the registry (protocol 2025-11-25 IS in @versions); the real crash site was much earlier, in the Plug's runtime-config resolution. Fix: change the Harness.Application MCP child spec from {Harness.Dashboard.MCPServer, transport: :streamable_http} to {Harness.Dashboard.MCPServer, transport: {:streamable_http, start: true}}. The :start opt is checked before the auto-detect (deps/anubis_mcp/lib/anubis/server/supervisor.ex:336-337), explicitly telling Anubis to start regardless of the global Phoenix flag — matching reality, since the dashboard endpoint already runs (per-endpoint server: true). Verification: synthetic Plug.Test against StreamableHTTP.Plug initialize returns 200 with protocolVersion 2025-11-25 + tools capability + mcp-session-id header; full browser smoke via /harness/chat invoked claude -p, hit /harness/mcp/initialize (200), /harness/mcp/tools/list, /harness/mcp/tools/call name=project_registry__list, and rendered the harness tool name in the dashboard tool_call panel with real project data in the assistant response. Phoenix logs contain zero :badarg or 500 lines from /harness/mcp during the smoke. Regression coverage: new 'supervised streamable_http transport (Task 83)' describe block in test/harness/dashboard/mcp_server_test.exs (2 tests — persistent_term presence + initialize end-to-end). 9/9 mcp_server tests pass, 55/55 dashboard tests pass."
delivered_by = "claude"
verified = true
created_at = "2026-05-28"
scored_at = "2026-05-28"
done_at = "2026-05-28"

