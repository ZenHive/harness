body = """
After an agent finishes, harness runs the target project's own check stack against its worktree and produces a structured pass/fail — this is what makes "did the job succeed?" objective and agent-agnostic, instead of trusting the agent's self-report. The check set is a configurable list of commands; ship an Elixir preset (`mix test.json`, `mix dialyzer.json`, doctor, sobelow, credo). Aggregate each check's result into one verdict the run lifecycle can gate on.
"""
implemented = "Harness.Verification grades a worktree by running a configurable check stack and aggregating per-check Results into a Verdict (any red => red). Ships elixir_preset/0: mix test.json, dialyzer.json, credo --strict, doctor, sobelow --exit. Each check is spawned over an OTP port bounded by an absolute per-check deadline (default 600_000 ms) so a hung check — idle or still streaming output — is killed rather than wedging the run; System.cmd was rejected as uninterruptible and subprocess-orphaning. Each Result carries a kind (:exited | :timed_out | :not_launched) so a consumer can distinguish a retryable timeout from a genuine red check. Check/Result/Verdict structs + config under :harness, :verification. 19 tests, 94% coverage."
