acceptance_criteria = ["Dispatched run does NOT red on TagTODO when the only TODO is in the dispatch base (not introduced by the agent)", "Regression test: dispatch base contains a `# TODO(...):` comment, agent's diff adds no TODOs, verification passes", "Dispatched run STILL reds on TagTODO when the agent ADDS a new TODO that was not in the dispatch base"]
