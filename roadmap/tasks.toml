status = "done"
title = "Run-detail transcript rework — parsed event list + <.transcript_view> component, ?raw=1 fallback"
scores = { d = 5, b = 9, u = 9 }
depends_on = [85, 86]
acceptance_criteria = [
  "lib/harness/dashboard/transcript.ex buffer changes from raw iodata binary to `{events :: [event()], parser_state :: term()}` per run; new `append_chunk/4` takes (chunks, agent_kind, parser_state, new_chunk) returning {new_chunks, new_parser_state}",
  "Cap moves from byte-count to event-count: default 500 events (configurable via :dashboard, :transcript_max_events); oldest events drop first when cap exceeded (mirrors today's iodata head-drop)",
  "Transcript.broadcast/2 broadcasts BOTH the new {:harness_transcript_events, run_id, seq, events} shape AND the legacy {:harness_transcript, run_id, seq, raw_chunk} for one release (so ?raw=1 still works)",
  "Harness.Run carries parser_state in its gen_statem data; on each :transcript_chunk it invokes Harness.Dashboard.Transcript.Parser.append/4 and broadcasts the resulting events; backfill snapshot via new Harness.Run.transcript_events/1 reader (legacy transcript/1 stays as raw-binary reader, deprecated)",
  "Harness.Dashboard.Components.transcript_view/1 (added on top of Task 85's module) walks the event list and renders: :assistant_text via <.message_row role={:assistant}>; consecutive :assistant_text events in one turn collapse into one message body (mirror ChatLive's text_delta accumulator); :assistant_tool_use + matching :tool_result grouped via <.tool_call>; :system as <.eyebrow>-styled metadata line; :plain_text as <pre class=\"plain-chunk\"> monospace card; :unknown as muted <details> with raw chunk inside (nothing lost)",
  "Component is `use Phoenix.Component` style — declares `attr :events, :list, required: true` and `attr :agent, :atom, required: true`; uses HEEx `:if` / `:for` (no Enum.map + raw)",
  "lib/harness/dashboard/live.ex :show action swaps `<pre class=\"transcript\">{@transcript}</pre>` for `<Components.transcript_view events={@transcript_events} agent={@agent_kind} />`; assigns updated from iodata to event list; subscribes to the new transcript-events topic on mount",
  "?raw=1 query param on /harness/runs/<id> renders the original `<pre>` view from the legacy raw iodata buffer — proves the parser cutover is reversible at the URL level and gives operators a parser-bug escape hatch",
  "Per-agent browser-verified coverage: dispatch one run per adapter (Claude, Codex, Cursor, Grok, Pi) via the two-eval Tidewave pattern; open /harness/runs/<id> mid-run; assert chat-style turns render for structured agents, monospace cards for passthrough agents, and zero :unknown events on a successful structured run",
  "Backfill works: start a run, wait 30s after first output, then open /harness/runs/<id> — prior events present (not just future ones); equivalent to Task 63 behaviour but on event list, not raw binary",
  "Tests: components_test.exs adds transcript_view render-tree assertions per event kind; run_test.exs covers parser-state threading through gen_statem; transcript_test.exs covers event-count cap eviction; integration test covers backfill via transcript_events/1"
]
out_of_scope = [
  "Removing legacy Harness.Run.transcript/1 raw reader — one-release deprecation window per the plan's Out of Scope note",
  "Replacing the PubSub topic scheme — keep harness:run:<id>:transcript; only the broadcast payload shape changes",
  "Persistence of transcript events to disk (LogRecord still carries raw agent_output; events are dashboard-render-only)",
  "Live-export of parsed transcript to JSON/markdown (could be a v0_9 follow-up)",
  "Backfilling parsed events for runs that completed BEFORE this task ships — only new runs and in-flight runs get the parsed view"
